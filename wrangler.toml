name = "cookiecloud-worker"
main = "src/index.js"
compatibility_date = "2024-12-01"

# 先创建 KV 命名空间，再把 ID 填入这里：
#   npx wrangler kv namespace create COOKIE_KV
#   npx wrangler kv namespace create COOKIE_KV --preview
[[kv_namespaces]]
binding = "COOKIE_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_YOUR_KV_NAMESPACE_PREVIEW_ID"

# 可选：挂到二级目录时改为 /cookie（默认 "/" 即根路径，部署时可改）
[vars]
API_ROOT = "/"
